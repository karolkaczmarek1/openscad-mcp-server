readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "python-dotenv>=1.0",
    "numpy-stl>=3.1",
    "Pillow>=10.1",
]

[tool.uv]
package = false
